[package]
name = "meteor-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/nantianz/OpenMeteor"
description = "WebAssembly entry crate"








[lib]
crate-type = ["cdylib"]



[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--strip-debug", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
demangle-name-section = false

[dependencies]
wasm-bindgen-futures = "0.4"
meteor-app = { path = "../meteor-app" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"


getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }



[patch.crates-io]
wgpu-hal = { path = "../../vendor/wgpu-hal" }
bevy_render = { path = "../../vendor/bevy_render" }
bevy_pbr = { path = "../../vendor/bevy_pbr" }

[features]
original-assets = []
